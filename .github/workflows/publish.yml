name: Publish packages

# Runs when a version tag is pushed (git tag v0.2.0 && git push origin v0.2.0), or by hand from the Actions tab.
# Publishes to nuget.org with Trusted Publishing: no API key is stored, the job gets a short-lived one via OIDC.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # needed for nuget.org and npmjs.com Trusted Publishing

jobs:
  nuget:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - run: dotnet pack AbpAdmin.Packages.slnx -c Release

      - name: nuget.org login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # your nuget.org profile name, not your email

      - run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # npmjs.com Trusted Publishing: npm (11.5+) exchanges the job's OIDC token itself, no NPM_TOKEN needed.
  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - name: Publish (core, features, then the all-in-one; versions already on npm are skipped)
        run: |
          for p in core audit-logging identity openiddict background-jobs tenant-management entity-explorer abp-admin; do
            cd dist/$p
            id="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
            if npm view "$id" version >/dev/null 2>&1; then echo "skip $id"; else npm publish --access public; fi
            cd ../..
          done
